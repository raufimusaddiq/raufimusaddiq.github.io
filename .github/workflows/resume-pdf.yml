name: Generate public resume PDF

on:
  push:
    branches:
      - master
    paths:
      - "resume.html"
      - ".github/workflows/resume-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Render resume
        run: weasyprint resume.html resume.pdf

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- resume.pdf && [ -f resume.pdf ]; then
            echo "resume.pdf unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git commit -m "build: refresh public resume PDF"
          git push
